name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install numpy safetensors

      - name: Build
        run: make clean && make

      - name: Unit tests
        run: make test

      - name: Smoke test
        run: make smoke

      - name: Phase A parity
        run: make parity

      - name: Phase D parity-v2
        run: make parity-v2

      - name: Phase D M2 micro-HF
        run: make m2

      - name: Mixtral micro + stream converter
        run: make mixtral-micro && make stream-mixtral

      - name: Version
        run: ./rabbit version

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make clean && make

      - name: Unit tests
        run: make test

      - name: Smoke test
        run: make smoke

      - name: Version
        run: ./rabbit version

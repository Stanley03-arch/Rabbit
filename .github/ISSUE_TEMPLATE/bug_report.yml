name: Bug report
description: Report a reproducible defect in Rabbit.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a reproducible report.
        Please run `make check` first. If it fails on a clean checkout, say so below.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `./rabbit version`, plus the commit hash if you built from source (`git rev-parse HEAD`).
      placeholder: "Rabbit 0.4.8"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, RAM, compiler and version, Python version.
      placeholder: "Ubuntu 24.04, 4 GB RAM, gcc 13.2, Python 3.11"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model source
      options:
        - Synthetic test model (make test-model)
        - Reference fixture (ref-v1 / ref-v2)
        - Converted from Hugging Face
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Exact commands, including converter flags such as `--layout` and `--quant`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      render: shell
    validations:
      required: true

name: Bug Report
description: Report a crash, incorrect output, or unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Rabbit more reliable. Please fill in as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the unexpected behavior
      placeholder: e.g. Chat crashes after 12 tokens on OLMoE with RABBIT_CACHE_SLOTS=32
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, model path, environment variables
      placeholder: |
        1. make && make test-model
        2. export RABBIT_NO_MMAP=1
        3. ./rabbit chat --model models/xxx.rabbit --tokens 32
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + compiler
      placeholder: Ubuntu 24.04 / gcc 13.2 / WSL2
  - type: input
    id: version
    attributes:
      label: Rabbit version / commit
      placeholder: 0.4.28 or git SHA
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell

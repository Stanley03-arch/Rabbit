name: Good First Issue
description: Suggest or claim a small, well-scoped starter task
title: "[good first issue] "
labels: ["good first issue"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task description
      description: What exactly needs to be done?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Tests
        - C core
        - Converter / tools
        - Dashboard / web
        - Build / CI
        - Model support
    validations:
      required: true

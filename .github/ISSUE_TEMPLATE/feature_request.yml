name: Feature Request
description: Propose a new capability or improvement
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love focused, low-RAM-friendly ideas. Please keep the scope tight.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Prefer small, incremental changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: size
    attributes:
      label: Estimated size
      options:
        - Tiny (docs / config / 1 file)
        - Small (few files, clear tests)
        - Medium
        - Large (needs design discussion first)
    validations:
      required: true
